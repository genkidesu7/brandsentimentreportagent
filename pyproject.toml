[project]
name = "cmn-c1-091"
version = "1.0.0"
description = "BrandSentimentReportAgent -- AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*"]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
